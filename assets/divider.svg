<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" role="img" aria-label="divisor">
  <defs>
    <linearGradient id="gd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6"/><stop offset=".5" stop-color="#c084fc"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="bgd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0a1a"/><stop offset="1" stop-color="#1a1030"/>
    </linearGradient>
    <pattern id="dotsd" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#c084fc" opacity=".18"/>
    </pattern>
    <linearGradient id="shined" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6"/><stop offset=".35" stop-color="#c084fc"/>
      <stop offset=".5" stop-color="#ffffff"/><stop offset=".65" stop-color="#c084fc"/><stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="pd"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#f472b6"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
  </defs>
  <line x1="0" y1="12" x2="1000" y2="12" stroke="url(#gd)" stroke-width="1.5" opacity=".5"/>
  <ellipse cy="12" rx="60" ry="5" fill="url(#pd)"><animate attributeName="cx" values="-60;1060" dur="4s" repeatCount="indefinite"/></ellipse>
</svg>