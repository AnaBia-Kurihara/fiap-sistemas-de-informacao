  <defs>
    <linearGradient id="gh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6"/><stop offset=".5" stop-color="#c084fc"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="bgh" x1="0" y1="0" x2="1" y2="1">
