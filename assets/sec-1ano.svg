<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" role="img" aria-label="1º ANO">
  <defs>
    <linearGradient id="gssec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6"/><stop offset=".5" stop-color="#c084fc"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="bgssec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0a1a"/><stop offset="1" stop-color="#1a1030"/>
    </linearGradient>
    <pattern id="dotsssec" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#c084fc" opacity=".18"/>
    </pattern>
    <linearGradient id="shinessec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6"/><stop offset=".35" stop-color="#c084fc"/>
      <stop offset=".5" stop-color="#ffffff"/><stop offset=".65" stop-color="#c084fc"/><stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient></defs>
  <text x="4" y="22" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#f472b6" letter-spacing="2">// ano-letivo-01</text>
  <text x="2" y="58" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" letter-spacing="2" fill="url(#shinessec)">1º ANO</text>
  <line x1="124" y1="47" x2="1000" y2="47" stroke="#c084fc" stroke-opacity=".25" stroke-width="1.5"/>
  <line x1="124" y1="47" x2="1000" y2="47" stroke="url(#gssec)" stroke-width="2.5" pathLength="1" stroke-dasharray=".18 .82">
    <animate attributeName="stroke-dashoffset" from="0" to="-1" dur="4s" repeatCount="indefinite"/>
  </line>
  <circle cx="124" cy="47" r="5" fill="#f472b6"><animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/></circle>
  <rect x="2" y="70" height="3" rx="1.5" fill="url(#gssec)" width="0">
    <animate attributeName="width" values="0;112;112;0" keyTimes="0;.25;.85;1" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>